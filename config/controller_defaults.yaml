    kd: 50.0
    hold_initial_position: true
    q_des: []
    qdot_des: []
    publish_desired_state: true
    publish_error_state: true

  pd_gravity:
    kp: 150.0
    kd: 20.0
    hold_initial_position: true
    q_des: []
    qdot_des: []
    dynamics_data_dir: "/home/nikos/ros2_ws/src/smm_class_pkgs/smm_data/synthesis/yaml"
    gravity_representation: "body"
    publish_error_state: true
    publish_desired_state: true

  joint_inverse_dynamics:
    kp: 200.0
    kd: 10.0
    hold_initial_position: false
    qdot_des_default_value: 0.0
    qddot_des_default_value: 0.0
    dynamics_data_dir: "/home/nikos/ros2_ws/src/smm_class_pkgs/smm_data/synthesis/yaml"
    dynamics_representation: "body"
    publish_error_state: true
    publish_desired_state: true
    trajectory_interpolation_mode: "sync_cubic"

  cartesian_pd_gravity:
    kp_cartesian: [200.0, 200.0, 200.0]
    kd_cartesian: [10.0, 10.0, 10.0]
    hold_initial_position: true
    x_des: []
    xdot_des: []
    kinematics_data_dir: "/home/nikos/ros2_ws/src/smm_class_pkgs/smm_data/synthesis/yaml"
    dynamics_data_dir: "/home/nikos/ros2_ws/src/smm_class_pkgs/smm_data/synthesis/yaml"
    gravity_representation: "body"
    fixed_frame: "world"
    publish_error_state: true
    publish_desired_state: true
    publish_current_state: true

  cartesian_pose_pd_gravity:
    kp_position: [500.0, 500.0, 500.0]
    kd_position: [50.0, 50.0, 50.0]
    kp_orientation: [10.0, 10.0, 10.0]
    kd_orientation: [5.0, 5.0, 5.0]
    hold_initial_position: true
    x_des: []
    xdot_des: []
    kinematics_data_dir: "/home/nikos/ros2_ws/src/smm_class_pkgs/smm_data/synthesis/yaml"
    dynamics_data_dir: "/home/nikos/ros2_ws/src/smm_class_pkgs/smm_data/synthesis/yaml"
    gravity_representation: "body"
    fixed_frame: "world"
    publish_error_state: true
    publish_desired_state: true
    publish_current_state: true
    publish_full_debug_state: true  

  cartesian_inv_dyn:
    kp_position: [400.0,400.0,400.0]
    kd_position: [20.0, 20.0, 20.0]
    kp_orientation: [400.0, 400.0, 400.0]
    kd_orientation: [20.0, 20.0, 20.0]
    hold_initial_position: true
    x_des: []
    xdot_des: []
    orientation_des: []
    kinematics_data_dir: "/home/nikos/ros2_ws/src/smm_class_pkgs/smm_data/synthesis/yaml"
    dynamics_data_dir: "/home/nikos/ros2_ws/src/smm_class_pkgs/smm_data/synthesis/yaml"
    gravity_representation: "body"
    fixed_frame: "world"
    operational_dynamics_method: "exact_with_damped_fallback"
    operational_damping: 0.025
    task_acceleration_scale: 0.50
    condition_soft_limit: 500.0
    condition_hard_limit: 2000.0
    orientation_condition_scaling: true
    publish_error_state: true
    publish_desired_state: true
    publish_current_state: true
    publish_full_debug_state: true      

  cartesian_robust_inv_dyn:
    kp_position: [500.0, 500.0, 500.0]
    kd_position: [30.0, 30.0, 30.0]

    kp_orientation: [0.0, 0.0, 0.0]
    kd_orientation: [0.0, 0.0, 0.0]

    # Higher lambda means the sliding variable reacts more strongly to slide error.
    lambda_position: [5.0, 5.0, 5.0]
    lambda_orientation: [0.0, 0.0, 0.0]

    # F_robust_linear = k1 * s
    # Linear robust damping/stabilizing wrench
    k1_position: [20.0, 20.0, 20.0]
    k1_orientation: [0.0, 0.0, 0.0]

    # F_robust_nonlinear = k2 * tanh(kappa * s)
    # Bounded nonlinear robust wrench - helps reject anatomy/model mismatch without using discontinuous signal
    k2_position: [10.0, 10.0, 10.0]
    k2_orientation: [0.0, 0.0, 0.0]

    # Controls how quickly tanh(kappa*s) saturates
    tanh_kappa: 5.0

    hold_initial_position: true
    x_des: []
    xdot_des: []
    orientation_des: []

    kinematics_data_dir: "/home/nikos/ros2_ws/src/smm_class_pkgs/smm_data/synthesis/yaml"
    dynamics_data_dir: "/home/nikos/ros2_ws/src/smm_class_pkgs/smm_data/synthesis/yaml"
    gravity_representation: "body"
    fixed_frame: "world"

    operational_dynamics_method: "exact_with_damped_fallback"
    operational_damping: 0.05
    task_acceleration_scale: 0.5

    condition_soft_limit: 500.0
    condition_hard_limit: 2000.0
    orientation_condition_scaling: true

    effort_limit: 80.0

    publish_error_state: true
    publish_desired_state: true
    publish_current_state: true
    publish_full_debug_state: true  